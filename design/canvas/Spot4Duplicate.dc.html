<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a Spot — Duplicate check and visibility</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.s{font-weight:700;font-size:13px;line-height:1.35;color:#5E6E74}
.lbl{font-weight:900;font-size:15px;color:#1F2A2E}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 16px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;letter-spacing:.05em;text-transform:uppercase;text-align:center;cursor:pointer;text-decoration:none}
.bp{background:#0C807A;color:#FFFFFF;box-shadow:0 4px 0 #075B56}
.sm{flex:1;min-height:42px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.segb{flex:1;height:10px;border-radius:99px;background:#1CB0A8}
.card{background:#FFFFFF;border:2px solid #E5E5DC;border-bottom-width:4px;border-radius:20px}
.vis{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;border:2px solid #E5E5DC;border-bottom-width:4px;background:#FFFFFF;text-align:left;font-family:'Nunito',sans-serif;cursor:pointer;width:100%}
.vis.on{border-color:#1CB0A8;background:#E3F7F5}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
</style>
</helmet>
<div style="width: 390px; height: 1080px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'Nunito', system-ui, sans-serif; color: #3C4A4F; display: flex; flex-direction: column; padding: 14px 16px 26px; gap: 18px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Spot3Details.dc.html" aria-label="Back" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #8A979C"><svg viewBox="0 0 24 24" style="width: 24px; height: 24px"><path class="st" d="M15 5l-7 7 7 7" style="stroke-width: 3"></path></svg></a>
      <p style="flex-grow: 1; font-weight: 900; font-size: 18px; color: #1F2A2E">Add a Spot</p>
      <span class="s">Step 4 of 4</span>
    </div>
    <div style="display: flex; gap: 6px" aria-hidden="true"><span class="segb"></span><span class="segb"></span><span class="segb"></span><span class="segb"></span></div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 10px">
    <img src="/_blob/d1b0d6198561f208461b0f6704094021" alt="" style="width: 84px; height: 84px; flex: none">
    <div style="padding: 12px 14px; border-radius: 18px; border: 2px solid #E5E5DC; background: #FFFFFF; margin-bottom: 16px">
      <p style="font-weight: 900; font-size: 18px; color: #1F2A2E">Is this the same place?</p>
      <p class="s">2 spots already exist within 1.5 km.</p>
    </div>
  </div>

  <div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 12px">
      <img src="/_blob/7000c508ed65b0395bc9ba13d1d81dcd" alt="" style="width: 72px; height: 72px; border-radius: 14px; object-fit: cover; flex: none">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
        <p style="font-weight: 900; font-size: 16px; color: #1F2A2E">Kyzylsay Cave</p>
        <p class="s">Cave · 480 m away · added by Bekzod T.</p>
        <span style="align-self: flex-start; display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 99px; background: #ECEEEF; color: #56646A; font-weight: 800; font-size: 12px">Not verified · 1 check-in</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <button class="sm" style="background: #FFFFFF; color: #0C807A; border: 2px solid #E5E5DC; box-shadow: 0 3px 0 #E5E5DC">Same place</button>
      <button class="sm" style="background: #1CB0A8; color: #06302D; border: 2px solid #1CB0A8; box-shadow: 0 3px 0 #0E8A83">Different</button>
    </div>
  </div>
  <div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 12px">
      <img src="/_blob/6bbbc6ee6ced1a3bc81f1d2ce372f0fe" alt="" style="width: 72px; height: 72px; border-radius: 14px; object-fit: cover; flex: none">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
        <p style="font-weight: 900; font-size: 16px; color: #1F2A2E">Beldersay Gully Trail</p>
        <p class="s">Trail · 1.2 km away · officially verified</p>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <button class="sm" style="background: #FFFFFF; color: #0C807A; border: 2px solid #E5E5DC; box-shadow: 0 3px 0 #E5E5DC">Same place</button>
      <button class="sm" style="background: #1CB0A8; color: #06302D; border: 2px solid #1CB0A8; box-shadow: 0 3px 0 #0E8A83">Different</button>
    </div>
  </div>

  <div role="radiogroup" aria-label="Visibility" style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
    <p class="lbl">Who can see it?</p>
    <button class="vis" role="radio" aria-checked="false">
      <span style="width: 42px; height: 42px; border-radius: 14px; background: #E2F0FF; color: #1F5FA8; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" style="width: 22px; height: 22px"><circle class="st" cx="12" cy="12" r="9"></circle><path class="st" d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"></path></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="lbl">Public</span><span class="s">Everyone can find it after review</span></span>
      <span style="width: 26px; height: 26px; border-radius: 50%; border: 3px solid #E5E5DC; flex: none"></span>
    </button>
    <button class="vis on" role="radio" aria-checked="true">
      <span style="width: 42px; height: 42px; border-radius: 14px; background: #ECE8FF; color: #4B33C4; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" style="width: 22px; height: 22px"><path class="st" d="M5 21c0-9 5-15 15-17-1 9-6 15-15 17zM5 21l9-10"></path></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="lbl">Fragile — my groups only</span><span class="s">For delicate caves, nesting areas or places that can't handle crowds</span></span>
      <svg viewBox="0 0 24 24" style="width: 26px; height: 26px; flex: none"><circle cx="12" cy="12" r="11" style="fill: #1CB0A8"></circle><path d="M7 12.5l3.2 3.2L17 9" style="fill: none; stroke: #FFFFFF; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1"></div>
  <a class="btn bp" href="Spot5Submitted.dc.html">Submit spot</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
