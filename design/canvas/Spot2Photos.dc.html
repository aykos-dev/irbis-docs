<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a Spot — Photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.s{font-weight:700;font-size:13px;line-height:1.35;color:#5E6E74}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 16px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;letter-spacing:.05em;text-transform:uppercase;text-align:center;cursor:pointer;text-decoration:none}
.bp{background:#0C807A;color:#FFFFFF;box-shadow:0 4px 0 #075B56}
.seg{flex:1;height:10px;border-radius:99px;background:#E5E5DC}
.ph{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;border:2px solid #E5E5DC;border-bottom-width:4px}
.ph img{width:100%;height:100%;object-fit:cover}
.add{aspect-ratio:1/1;border-radius:18px;border:2px dashed #C9CDC2;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5E6E74;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;cursor:pointer}
.num{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;color:#1F2A2E;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.del{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(31,42,46,.75);color:#FFFFFF;display:flex;align-items:center;justify-content:center;border:0;padding:0}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tg{width:52px;height:32px;border-radius:99px;background:#1CB0A8;position:relative;flex:none}
.tg::after{content:'';position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'Nunito', system-ui, sans-serif; color: #3C4A4F; display: flex; flex-direction: column; padding: 14px 16px 26px; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Spot1Gps.dc.html" aria-label="Back" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #8A979C"><svg viewBox="0 0 24 24" style="width: 24px; height: 24px"><path class="st" d="M15 5l-7 7 7 7" style="stroke-width: 3"></path></svg></a>
      <p style="flex-grow: 1; font-weight: 900; font-size: 18px; color: #1F2A2E">Add a Spot</p>
      <span class="s">Step 2 of 4</span>
    </div>
    <div style="display: flex; gap: 6px" aria-hidden="true"><span class="seg" style="background: #1CB0A8"></span><span class="seg" style="background: #1CB0A8"></span><span class="seg"></span><span class="seg"></span></div>
  </div>
  <div>
    <h1 style="font-weight: 900; font-size: 26px; color: #1F2A2E">Add photos</h1>
    <p class="s" style="font-size: 15px; margin-top: 4px">At least 3: the place itself, the approach path and a landmark.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div class="ph"><img src="/_blob/7000c508ed65b0395bc9ba13d1d81dcd" alt="Cave entrance" style="object-position: 50% 80%"><span class="num">1</span><button class="del" aria-label="Remove photo 1"><svg viewBox="0 0 24 24" style="width: 14px; height: 14px"><path class="st" d="M6 6l12 12M18 6L6 18" style="stroke-width: 3"></path></svg></button></div>
    <div class="ph"><img src="/_blob/6bbbc6ee6ced1a3bc81f1d2ce372f0fe" alt="Approach path" style="object-position: 30% 70%"><span class="num">2</span><button class="del" aria-label="Remove photo 2"><svg viewBox="0 0 24 24" style="width: 14px; height: 14px"><path class="st" d="M6 6l12 12M18 6L6 18" style="stroke-width: 3"></path></svg></button></div>
    <div class="ph"><img src="/_blob/3bcf1e0665966f4e7c7c5bda82dd8d57" alt="Landmark peak" style="object-position: 50% 30%"><span class="num">3</span><button class="del" aria-label="Remove photo 3"><svg viewBox="0 0 24 24" style="width: 14px; height: 14px"><path class="st" d="M6 6l12 12M18 6L6 18" style="stroke-width: 3"></path></svg></button></div>
    <button class="add"><svg viewBox="0 0 24 24" style="width: 28px; height: 28px"><path class="st" d="M3 8h4l2-3h6l2 3h4v11H3z"></path><circle class="st" cx="12" cy="13" r="3.5"></circle></svg>Camera</button>
    <button class="add"><svg viewBox="0 0 24 24" style="width: 28px; height: 28px"><rect class="st" x="3" y="4" width="18" height="16" rx="3"></rect><path class="st" d="M3 16l5-5 4 4 3-3 6 6"></path></svg>Gallery</button>
    <div class="add" style="border-style: solid; background: #F2F3EE; cursor: default">Optional</div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #DFF6E7; color: #1B6B3E; font-weight: 800; font-size: 14px">
    <svg viewBox="0 0 24 24" style="width: 20px; height: 20px"><path class="st" d="M5 12.5l4.5 4.5L19 7.5"></path></svg>3 of 3 required photos · taken on site
  </div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 2px solid #E5E5DC; border-bottom-width: 4px">
    <div style="flex-grow: 1"><p style="font-weight: 800; font-size: 15px; color: #1F2A2E">Remove location data from public photos</p><p class="s">Protects fragile places from geotag sharing</p></div>
    <span class="tg" role="switch" aria-checked="true" aria-label="Remove photo location data"></span>
  </div>
  <div style="flex-grow: 1"></div>
  <a class="btn bp" href="Spot3Details.dc.html">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
