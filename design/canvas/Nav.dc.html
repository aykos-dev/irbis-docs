    </span>
    <span style="font-weight: 800; font-size: 11px">Path</span>

  <a href="Explore.dc.html" aria-label="Explore" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{c.explore.fg}}">

      <svg viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M3 6.5l6-3 6 3 6-3V18l-6 3-6-3-6 3zM9 3.5V18M15 6.5V21" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round"></path></svg>
    </span>
    <span style="font-weight: 800; font-size: 11px">Explore</span>
  </a>
  <a href="LessonsHub.dc.html" aria-label="Lessons" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{c.lessons.fg}}">
    <span style="width: 54px; height: 42px; border-radius: 14px; border: 2px solid {{c.lessons.bd}}; background: {{c.lessons.bg}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M9 8h7" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"></path></svg>

    <span style="font-weight: 800; font-size: 11px">Profile</span>

</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["path","explore","lessons","groups","profile"],"default":"path"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'path';
    const d = !!this.props.dark;
    const on = d ? { bg: '#123B3A', bd: '#1CB0A8', fg: '#5FD6CE' } : { bg: '#E3F7F5', bd: '#1CB0A8', fg: '#0C807A' };
    const off = d ? { bg: 'transparent', bd: 'transparent', fg: '#9AA8AD' } : { bg: 'transparent', bd: 'transparent', fg: '#5E6E74' };
    const c = {};
    ['path', 'explore', 'lessons', 'groups', 'profile'].forEach((k) => { c[k] = a === k ? on : off; });
    return { c, bg: d ? '#1C2A30' : '#FFFFFF', line: d ? '#2B3B42' : '#E5E5DC' };
  }
}
</script>
</body>
</html>
