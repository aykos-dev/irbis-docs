<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mafia — night</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.s{font-weight:700;font-size:13px;line-height:1.4;color:#8C9AA0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 16px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.p{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:18px;border-style:solid;border-width:2px 2px 4px;font-family:'Nunito',sans-serif;cursor:pointer;position:relative}
.pa{width:52px;height:52px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pa img{width:58px;height:58px;margin-top:10px}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFFFFF}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A1013; font-family: 'Nunito', system-ui, sans-serif; color: #C5D0CF; display: flex; flex-direction: column; gap: 16px; padding: 18px 16px 26px">
  <span class="star" style="left: 40px; top: 40px; opacity: .7"></span><span class="star" style="left: 120px; top: 90px; opacity: .4"></span><span class="star" style="left: 300px; top: 30px; opacity: .6"></span><span class="star" style="left: 250px; top: 110px; opacity: .3"></span><span class="star" style="left: 350px; top: 140px; opacity: .5"></span>
  <div style="display: flex; align-items: center; justify-content: space-between; position: relative">
    <div><p style="font-weight: 900; font-size: 13px; letter-spacing: .12em; color: #F7D774">NIGHT 2</p><p style="font-weight: 900; font-size: 26px; color: #F1F5F4">Doctor, wake up</p></div>
    <svg viewBox="0 0 24 24" style="width: 52px; height: 52px; color: #F7D774"><path class="fl" d="M14 3a9 9 0 1 0 7 13A7 7 0 0 1 14 3z"></path></svg>
  </div>
  <p class="s" style="font-size: 15px; color: #C5D0CF; position: relative">Who will you save tonight?</p>

  <div role="radiogroup" aria-label="Players" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; position: relative">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="9">
      <button class="p" role="radio" aria-checked="{{p.sel}}" style="background: {{p.bg}}; border-color: {{p.bd}}; opacity: {{p.op}}">
        <span class="pa" style="background: {{p.tint}}; filter: {{p.filter}}"><img src="{{p.img}}" alt=""></span>
        <span style="font-weight: 900; font-size: 13px; color: #F1F5F4">{{p.name}}</span>
        <span class="s" style="font-size: 11px">{{p.note}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: #131D22; border: 2px solid #22323A; position: relative">
    <svg viewBox="0 0 24 24" style="width: 22px; height: 22px; color: #8C9AA0; flex: none"><circle class="st" cx="12" cy="12" r="9"></circle><path class="st" d="M12 7v5l3 2"></path></svg>
    <p class="s">0:24 left · Everyone else is tapping a task too, so nobody can tell who you are.</p>
  </div>

  <div style="flex-grow: 1"></div>
  <a class="btn" href="MafDay.dc.html" style="background: #2E8B57; color: #FFFFFF; box-shadow: 0 4px 0 #1F6233; position: relative">Save Aziz</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      fox: ['/_blob/d1b0d6198561f208461b0f6704094021', '#FFE9D9'], bear: ['/_blob/ffe227711df8d0445b9dfe0a9534a6f4', '#E3ECFB'],
      marmot: ['/_blob/d4c16d0e9ea4296c5638d9b3cf6bfee5', '#F7EADB'], eagle: ['/_blob/55d73e65f5c5f754c2cbb05b4ea4a0ce', '#ECE8FF'],
      panda: ['/_blob/44b792e405b2dce67f0743e4be0fc2e1', '#E4F5E7'], ibex: ['/_blob/dba7b9623f9af9c690bf93a6ddc5f60b', '#DDF5F3']
    };
    const list = [['Timur', 'fox'], ['Aziz', 'bear', 'sel'], ['Laylo', 'marmot'], ['You', 'ibex', 'self'], ['Kamila', 'fox', 'out'], ['Bekzod', 'eagle'], ['Otabek', 'panda'], ['Madina', 'marmot'], ['Sherzod', 'fox'], ['Nodira', 'ibex']];
    return { players: list.map(([name, a, st]) => ({
      name, img: P[a][0], tint: P[a][1], sel: st === 'sel' ? 'true' : 'false',
      bg: st === 'sel' ? '#173F2A' : '#131D22', bd: st === 'sel' ? '#2E8B57' : '#22323A',
      op: st === 'out' ? 0.4 : 1, filter: st === 'out' ? 'grayscale(1)' : 'none',
      note: st === 'out' ? 'out · Night 1' : (st === 'self' ? '1 self-save left' : (st === 'sel' ? 'saving' : ' '))
    })) };
  }
}
</script>
</body>
</html>
