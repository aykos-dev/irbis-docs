<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.s{font-weight:700;font-size:12px;line-height:1.35;color:#5E6E74}
.cap{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5E6E74}
.f{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:12px;border:2px solid #E5E5DC;border-bottom-width:4px;background:#FFFFFF;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:#3C4A4F;flex:none;cursor:pointer}
.f.on{border-color:#1CB0A8;background:#E3F7F5;color:#0B5B57}
.n{display:flex;gap:12px;padding:12px;border-radius:18px;align-items:flex-start;text-decoration:none}
.ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;color:#FFFFFF;overflow:hidden}
.st{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'Nunito', system-ui, sans-serif; color: #3C4A4F; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A979C"><svg viewBox="0 0 24 24" style="width: 26px; height: 26px"><path class="st" d="M15 5l-7 7 7 7" style="stroke-width: 3"></path></svg></a>
    <h1 style="flex-grow: 1; font-weight: 900; font-size: 26px; color: #1F2A2E">Notifications</h1>
    <button style="border: 0; background: transparent; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px; color: #0C807A; min-height: 44px; cursor: pointer">Mark all read</button>
  </div>
  <div style="display: flex; gap: 8px"><button class="f on">All</button><button class="f">Trips</button><button class="f">Social</button><button class="f">Rewards</button></div>

  <p class="cap" style="margin-top: 4px">Today</p>
  <sc-for list="{{today}}" as="x" hint-placeholder-count="4">
    <a class="n" href="{{x.href}}" style="background: {{x.bg}}; border: 2px solid {{x.bd}}">
      <span class="ic" style="background: {{x.icBg}}; color: {{x.icFg}}"><svg viewBox="0 0 24 24" style="width: 24px; height: 24px"><path d="{{x.icon}}" style="fill: currentColor; fill-rule: evenodd"></path></svg></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <p style="font-weight: 800; font-size: 14px; line-height: 1.35; color: #1F2A2E">{{x.text}}</p>
        <p class="s">{{x.time}}</p>
      </div>
      <sc-if value="{{x.unread}}" hint-placeholder-val="{{ true }}"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1CB0A8; flex: none; margin-top: 6px" aria-label="Unread"></span></sc-if>
    </a>
  </sc-for>
  <p class="cap" style="margin-top: 4px">Earlier</p>
  <sc-for list="{{earlier}}" as="x" hint-placeholder-count="3">
    <a class="n" href="{{x.href}}" style="background: {{x.bg}}; border: 2px solid {{x.bd}}">
      <span class="ic" style="background: {{x.icBg}}; color: {{x.icFg}}"><svg viewBox="0 0 24 24" style="width: 24px; height: 24px"><path d="{{x.icon}}" style="fill: currentColor; fill-rule: evenodd"></path></svg></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <p style="font-weight: 800; font-size: 14px; line-height: 1.35; color: #1F2A2E">{{x.text}}</p>
        <p class="s">{{x.time}}</p>
      </div>
    </a>
  </sc-for>
  <div style="flex-grow: 1"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      storm: 'M7 16h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 16zM12.5 13.5l-2.2 4.2h2.4l-1 4.3 4-5.6h-2.4l1.1-2.9z',
      trophy: 'M6 3h12v3a6 6 0 0 1-12 0zM10 13h4v4h3v3H7v-3h3z',
      swords: 'M4 3l8 8-2 2-8-8V3zM20 3h2v2l-8 8-2-2zM6 15l3 3-3 3-3-3zM18 15l3 3-3 3-3-3z',
      flame: 'M12 1.8c1.4 3.6 6 6 6 11.7A6 6 0 0 1 6 13.5c0-2.8 1.6-4.6 2.8-5.6.2 1.8 1 2.9 2.2 3.2C11.7 8.4 10.8 5 12 1.8z',
      flag: 'M5 21V3h2v1h12l-3 5 3 5H7v7z',
      users: 'M9 4.4a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 0 1 0-7.2zM2 20.5c.4-4.4 3.2-6.6 7-6.6s6.6 2.2 7 6.6zM17.5 6.3a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4zM17 13.6c2.9 0 4.6 2 5 5.4h-4.2z',
      heart: 'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z',
      clock: 'M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1 5v6l5 3 1-1.7-4-2.3V7z'
    };
    const n = (o) => Object.assign({ bg: o.unread ? '#FFFFFF' : 'transparent', bd: o.unread ? '#E5E5DC' : 'transparent', icFg: '#FFFFFF', unread: false, href: 'Home.dc.html' }, o);
    const today = [
      n({ icon: I.storm, icBg: '#D93636', text: 'Big Chimgan turned "Not now" for Saturday — storm. We found a swap: Beldersay Ridge.', time: '18 min ago · Trip', unread: true, href: 'Home.dc.html' }),
      n({ icon: I.swords, icBg: '#7B61FF', text: 'Dilnoza challenged you to a Bu qayer? duel. 23 h left.', time: '1 h ago · Social', unread: true, href: 'GameDuel.dc.html' }),
      n({ icon: I.trophy, icBg: '#FFC800', icFg: '#5C4000', text: 'Your Gulkam Canyon post is #14 in Top Shots — 46 likes to the Top 10.', time: '3 h ago · Rewards', unread: true, href: 'TopShots.dc.html' }),
      n({ icon: I.users, icBg: '#1CB0A8', text: 'Beldersay Ridge sunrise: meeting point moved to Chimgan bus stop, 05:00.', time: '5 h ago · Trip', href: 'GroupChat.dc.html' })
    ];
    const earlier = [
      n({ icon: I.flag, icBg: '#B88600', text: 'Chatkal Juniper Camp was officially verified. +150 Discoverer XP.', time: 'Yesterday · Rewards', href: 'MySpots.dc.html' }),
      n({ icon: I.heart, icBg: '#FF4B4B', text: 'Aziz and 31 others liked your post.', time: 'Yesterday · Social', href: 'PostDetail.dc.html' }),
      n({ icon: I.flame, icBg: '#FF9F1C', icFg: '#3A2200', text: 'Your 12-day streak is safe — the weather shield covered last weekend.', time: 'Mon · Rewards', href: 'Home.dc.html' })
    ];
    return { today, earlier };
  }
}
</script>
</body>
</html>
