<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.page{--bg:#F7F7F2;--card:#FFFFFF;--line:#E5E5DC;--ink:#1F2A2E;--body:#3C4A4F;--muted:#5E6E74;--soft:#EEF0E8;--tint:#E3F7F5;font-family:'Nunito',system-ui,sans-serif;color:var(--body);background:var(--bg);min-height:100vh}
p,h1,h2,h3{margin:0}
.h1{font-weight:900;font-size:28px;line-height:1.15;color:var(--ink)}
.h2{font-weight:900;font-size:22px;line-height:1.2;color:var(--ink)}
.h3{font-weight:800;font-size:17px;line-height:1.25;color:var(--ink)}
.t{font-weight:700;font-size:15px;line-height:1.45}
.s{font-weight:700;font-size:13px;line-height:1.35;color:var(--muted)}
.cap{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border:0;border-radius:14px;font-family:'Nunito',sans-serif;font-weight:900;font-size:14px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.bp{background:#0C807A;color:#FFFFFF;box-shadow:0 4px 0 #075B56}
.bw{background:var(--card);color:#0C807A;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bd{background:#D93636;color:#FFFFFF;box-shadow:0 4px 0 #A12121}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap}
.go{background:#DFF6E7;color:#1B6B3E}.no{background:#FFE1E1;color:#B32424}.ca{background:#FFF1BF;color:#6E4E00}.lk{background:#ECEEEF;color:#56646A}.tl{background:#E3F7F5;color:#0C807A}
.in{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:8px 12px;font:700 14px 'Nunito',sans-serif;color:var(--ink)}
.lbl{font-weight:900;font-size:13px;color:var(--ink)}
.side{flex:0 0 240px;background:var(--card);border-right:2px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:800;font-size:15px;color:var(--muted);text-decoration:none}
.nav.on{background:var(--tint);color:#0C807A;border:2px solid #1CB0A8}
.main{flex:999 1 640px;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:22px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:2px solid #F0F0EA;font-weight:700;color:var(--ink);white-space:nowrap}
.st{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div class="page" style="display: flex; align-items: center; justify-content: center; padding: 48px 20px">
  <div class="card" style="width: 100%; max-width: 420px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <img src="/_blob/68fc129c9d7433afd4cf66f5c7574e03" alt="Irbis" style="width: 52px; height: 52px; border-radius: 14px; box-shadow: 0 4px 0 #0E8A83">
      <div><p class="h2">Irbis Admin</p><p class="s">For the Irbis team only</p></div>
    </div>
    <form style="display: flex; flex-direction: column; gap: 14px">
      <label class="lbl" for="u" style="display: flex; flex-direction: column; gap: 6px">Username<input class="in" id="u" type="text" autocomplete="username" value="admin_one"></label>
      <label class="lbl" for="p" style="display: flex; flex-direction: column; gap: 6px">Password<input class="in" id="p" type="password" autocomplete="current-password" value="••••••••"></label>
      <a class="btn bp" href="AdmDashboard.dc.html" style="width: 100%">Log in</a>
    </form>
    <p class="s">Only accounts with the admin role can sign in. 5 wrong tries lock the account for 15 minutes.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
