<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:8px 20px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;text-align:center;cursor:pointer;text-decoration:none}
.bp{background:#0C807A;color:#FFFFFF;box-shadow:0 4px 0 #075B56}
.bw{background:#FFFFFF;color:#0C807A;border:2px solid #E5E5DC;box-shadow:0 4px 0 #E5E5DC}
.cf{position:absolute;border-radius:3px}
.xp{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;border:2px solid #E5E5DC;border-bottom-width:4px;background:#FFFFFF}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'Nunito', system-ui, sans-serif; color: #3C4A4F; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 28px; gap: 14px">
  <div style="position: absolute; left: -105px; top: 0; width: 600px; height: 600px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, #FFF1DA 0deg 10deg, #F7F7F2 10deg 20deg)"></div>
  <span class="cf" style="left: 30px; top: 90px; width: 12px; height: 12px; background: #FF9F1C; transform: rotate(20deg)"></span>
  <span class="cf" style="left: 340px; top: 80px; width: 10px; height: 16px; background: #4CA9FF; transform: rotate(-30deg)"></span>
  <span class="cf" style="left: 60px; top: 250px; width: 14px; height: 8px; background: #7B61FF; transform: rotate(40deg)"></span>
  <span class="cf" style="left: 340px; top: 270px; width: 12px; height: 12px; background: #FF4B4B; border-radius: 50%"></span>

  <span class="cf" style="left: 90px; top: 150px; width: 10px; height: 10px; background: #FFC800; transform: rotate(45deg)"></span>

  <p style="position: relative; font-weight: 900; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #8A4B00">Checked in · 12:48</p>
  <h1 style="position: relative; font-weight: 900; font-size: 36px; line-height: 1.05; color: #1F2A2E; text-align: center">Summit reached!</h1>
  <p style="position: relative; font-weight: 800; font-size: 16px; color: #3C4A4F">Upper Lake Viewpoint · 1,940 m</p>
  <img src="/_blob/95f8b158a1abf050c25de554103067a7" alt="Your fox companion proudly holding a flag on a summit" style="position: relative; width: 250px; height: 250px">

  <div style="position: relative; display: flex; gap: 10px; width: 100%">

    <div class="xp"><span style="display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 26px; color: #1F2A2E"><svg viewBox="0 0 24 24" style="width: 22px; height: 22px; color: #8C5A33"><path class="fl" d="M5 2.5h7.5v7.2l5.7 2.6A3.2 3.2 0 0 1 20 15.2V18H5z"></path></svg>5</span><span style="font-weight: 700; font-size: 13px; color: #5E6E74">Week streak</span></div>
  </div>

  <div style="position: relative; width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 20px; background: #FFFFFF; border: 2px solid #4CA9FF; border-bottom-width: 4px">

    <div style="flex-grow: 1"><p style="font-weight: 900; font-size: 12px; letter-spacing: .08em; color: #1F5FA8">BADGE UNLOCKED</p><p style="font-weight: 900; font-size: 18px; color: #1F2A2E">Lake Hopper</p><p style="font-weight: 700; font-size: 13px; color: #5E6E74">3 lakes checked in this season</p></div>
  </div>

  <div style="position: relative; margin-top: auto; width: 100%; display: flex; gap: 12px">
    <button class="btn bw" style="flex: 1"><svg viewBox="0 0 24 24" style="width: 20px; height: 20px"><path class="st" d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>Share</button>
    <a class="btn bp" href="Home.dc.html" style="flex: 1.6">Continue</a>
  </div>
</div>
