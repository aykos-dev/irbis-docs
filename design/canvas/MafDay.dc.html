<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mafia — day vote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.s{font-weight:700;font-size:13px;line-height:1.4;color:#9AA8AD}
.cap{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9AA8AD}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 16px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;border-style:solid;border-width:2px 2px 4px}
.pa{width:38px;height:38px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.pa img{width:42px;height:42px;margin-top:8px}
.vd{width:10px;height:10px;border-radius:50%;background:#D93636}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #131D22; font-family: 'Nunito', system-ui, sans-serif; color: #D5DEDD; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 26px">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 180px; background: linear-gradient(#3D2A10, #131D22)"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; position: relative">
    <div><p style="font-weight: 900; font-size: 13px; letter-spacing: .12em; color: #FFB547">DAY 2 · MORNING</p><p style="font-weight: 900; font-size: 26px; color: #F1F5F4">Town meeting</p></div>
    <div style="display: flex; flex-direction: column; align-items: center"><span style="font-weight: 900; font-size: 26px; color: #F1F5F4; font-variant-numeric: tabular-nums">1:24</span><span class="s" style="font-size: 11px">to vote</span></div>
  </div>

  <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: #1C2A30; border: 2px solid #2E8B57; border-bottom-width: 4px">
    <img src="/_blob/28945aeb0b5964efc16a541c4886feb8" alt="" style="width: 60px; height: 60px; flex: none">
    <div><p style="font-weight: 900; font-size: 16px; color: #F1F5F4">Nobody died last night!</p><p class="s">The doctor saved someone. 9 players remain.</p></div>
  </div>

  <div style="display: flex; justify-content: space-between; position: relative"><p class="cap">Vote to exile</p><p class="cap" style="color: #F1F5F4">6 / 9 voted</p></div>
  <div role="radiogroup" aria-label="Vote" style="display: flex; flex-direction: column; gap: 8px; position: relative">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <button class="row" role="radio" aria-checked="{{r.sel}}" style="background: {{r.bg}}; border-color: {{r.bd}}; font-family: 'Nunito', sans-serif; cursor: pointer; text-align: left">
        <span class="pa" style="background: {{r.tint}}"><img src="{{r.img}}" alt=""></span>
        <span style="flex-grow: 1; font-weight: 900; font-size: 15px; color: #F1F5F4">{{r.name}}</span>
        <span style="display: flex; gap: 4px" aria-label="{{r.votes}} votes"><sc-for list="{{r.dots}}" as="d" hint-placeholder-count="1"><span class="vd"></span></sc-for></span>
        <span style="width: 18px; text-align: right; font-weight: 900; color: #F1F5F4">{{r.votes}}</span>
      </button>
    </sc-for>
  </div>
  <p class="s" style="text-align: center; position: relative">Scroll for 2 more · you can also skip the vote</p>

  <div style="flex-grow: 1"></div>
  <a class="btn" href="MafEnd.dc.html" style="background: #D93636; color: #FFFFFF; box-shadow: 0 4px 0 #8F1F1F; position: relative">Vote Bekzod</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      fox: ['/_blob/d1b0d6198561f208461b0f6704094021', '#FFE9D9'], bear: ['/_blob/ffe227711df8d0445b9dfe0a9534a6f4', '#E3ECFB'],
      marmot: ['/_blob/d4c16d0e9ea4296c5638d9b3cf6bfee5', '#F7EADB'], eagle: ['/_blob/55d73e65f5c5f754c2cbb05b4ea4a0ce', '#ECE8FF'],
      panda: ['/_blob/44b792e405b2dce67f0743e4be0fc2e1', '#E4F5E7'], ibex: ['/_blob/dba7b9623f9af9c690bf93a6ddc5f60b', '#DDF5F3']
    };
    const list = [['Bekzod', 'eagle', 3, true], ['Otabek', 'panda', 2], ['Sherzod', 'fox', 1], ['Timur', 'fox', 0], ['Laylo', 'marmot', 0], ['Madina', 'marmot', 0]];
    return { rows: list.map(([name, a, votes, sel]) => ({ name, votes, img: P[a][0], tint: P[a][1], dots: Array.from({ length: votes }, () => ({})), sel: sel ? 'true' : 'false', bg: sel ? '#3A1A1D' : '#1C2A30', bd: sel ? '#D93636' : '#2B3B42' })) };
  }
}
</script>
</body>
</html>
