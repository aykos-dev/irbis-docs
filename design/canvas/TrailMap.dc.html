body{margin:0}
*{box-sizing:border-box}
.app{--line:#E5E5DC;--ink:#1F2A2E;--body:#3C4A4F;--muted:#5E6E74;font-family:'Nunito',system-ui,sans-serif;color:var(--body);background:#EEF3E8;position:relative;overflow:hidden;display:flex;flex-direction:column}
p,h1,h2,h3{margin:0}
.h2{font-weight:900;font-size:20px;line-height:1.2;color:var(--ink)}
.h3{font-weight:800;font-size:16px;line-height:1.25;color:var(--ink)}
.s{font-weight:700;font-size:13px;line-height:1.35;color:var(--muted)}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
.ibtn{width:46px;height:46px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:6px 16px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;text-align:center;cursor:pointer;text-decoration:none}
.bp{background:#0C807A;color:#FFFFFF;box-shadow:0 4px 0 #075B56}
.bw{background:#FFFFFF;color:#0C807A;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.wp{position:absolute;width:30px;height:30px;border-radius:50%;background:#FFFFFF;border:3px solid #FF9F1C;color:#8A4B00;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.k{flex:1;display:flex;flex-direction:column;align-items:center;gap:0}
.kn{font-weight:900;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
</style>
