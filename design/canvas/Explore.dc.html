<html lang="en">

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.app{--bg:#F7F7F2;--card:#FFFFFF;--line:#E5E5DC;--ink:#1F2A2E;--body:#3C4A4F;--muted:#5E6E74;--soft:#EEF0E8;--tint:#E3F7F5;font-family:'Nunito',system-ui,sans-serif;color:var(--body);background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
p,h1,h2,h3{margin:0}
.h2{font-weight:900;font-size:20px;line-height:1.2;color:var(--ink)}
.h3{font-weight:800;font-size:16px;line-height:1.25;color:var(--ink)}
.s{font-weight:700;font-size:13px;line-height:1.35;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap}
.go{background:#DFF6E7;color:#1B6B3E}.ca{background:#FFF1BF;color:#6E4E00}.no{background:#FFE1E1;color:#B32424}.lk{background:#ECEEEF;color:#56646A}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
.pin{position:absolute;width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:-2px 4px 0 rgba(0,0,0,.18)}
.pin svg{transform:rotate(45deg);width:22px;height:22px;color:#FFFFFF}
.sb{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #FFFFFF;display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.sb svg{width:11px;height:11px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;background:#FFFFFF;border:2px solid var(--line);border-bottom-width:4px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap;cursor:pointer;flex:none}
.fchip.on{background:var(--tint);border-color:#1CB0A8;color:#0C807A}
.pc{width:250px;flex:none;background:#FFFFFF;border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.boot{width:14px;height:14px;color:#7A4E2D}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px">
  <img src="/_blob/3c359f247bc28d3c219d502ed9bcf7f1" alt="" style="position: absolute; inset: 0; width: 390px; height: 844px; object-fit: cover">

      <button aria-label="All filters" style="width: 48px; height: 48px; border-radius: 16px; background: #0C807A; color: #FFFFFF; border: 0; box-shadow: 0 4px 0 #075B56; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; flex: none">

    <div style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">

  <div class="pin" style="left: 178px; top: 236px; background: #4CA9FF; width: 54px; height: 54px; border-width: 4px; box-shadow: -2px 5px 0 rgba(0,0,0,.2), 0 0 0 6px rgba(28,176,168,.35)"><svg viewBox="0 0 24 24" style="width: 26px; height: 26px"><path class="fl" d="M12 2.5c3.2 4.2 6.5 7.8 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3.7 3.3-7.3 6.5-11.5z"></path></svg></div>

  <div class="pin" style="left: 150px; top: 400px; background: #FF9F1C"><svg viewBox="0 0 24 24"><ellipse class="fl" cx="8" cy="14.5" rx="3" ry="4.5"></ellipse><ellipse class="fl" cx="16" cy="7" rx="3" ry="4.5"></ellipse></svg></div>
  <span class="sb" style="left: 182px; top: 392px; background: #2E8B57" aria-label="Go"><svg viewBox="0 0 24 24"><path class="st" d="M5 12.5l4.5 4.5L19 7.5" style="stroke-width: 4"></path></svg></span>

  <div style="position: absolute; left: 320px; top: 410px; width: 48px; height: 48px; border-radius: 50%; background: #1F2A2E; color: #FFFFFF; border: 3px solid #FFFFFF; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,.18)">12</div>

  <div style="position: absolute; left: 120px; top: 300px; width: 44px; height: 44px; border-radius: 50%; background: rgba(76,169,255,.22); display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; border-radius: 50%; background: #1F74C7; border: 3px solid #FFFFFF"></span></div>

  <button aria-label="Center on my location" style="position: absolute; right: 16px; top: 470px; width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; border: 2px solid var(--line); border-bottom-width: 4px; color: #1F74C7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg viewBox="0 0 24 24" style="width: 22px; height: 22px"><path class="fl" d="M21 3L3 10.5l7.5 3 3 7.5z"></path></svg></button>

  <div style="position: absolute; left: 0; right: 0; bottom: 84px; background: #FFFFFF; border-radius: 26px 26px 0 0; border-top: 2px solid var(--line); padding: 10px 0 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -6px 20px rgba(31,42,46,.08)">

        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Nav" active="explore" hint-size="390px,84px"></dc-import>
