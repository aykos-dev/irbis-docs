<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.s{font-weight:700;font-size:13px;line-height:1.35;color:#5E6E74}
.lbl{font-weight:900;font-size:14px;color:#1F2A2E;display:block}
.f{display:flex;flex-direction:column;gap:8px}
.in{width:100%;min-height:52px;border-radius:14px;border:2px solid #E5E5DC;background:#FFFFFF;padding:12px 14px;font:700 15px 'Nunito',sans-serif;color:#1F2A2E;resize:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;border:2px solid #E5E5DC;border-bottom-width:4px;background:#FFFFFF;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#3C4A4F;cursor:pointer}
.tag.on{border-color:#1CB0A8;background:#E3F7F5;color:#0B5B57}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid #F0F0EA}
.tg{width:52px;height:32px;border-radius:99px;position:relative;flex:none}
.tg.on{background:#1CB0A8}.tg.off{background:#D6D8D0}
.tg.on::after{content:'';position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#FFFFFF}
.tg.off::after{content:'';position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#FFFFFF}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.st{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #F7F7F2; font-family: 'Nunito', system-ui, sans-serif; color: #3C4A4F; display: flex; flex-direction: column; gap: 18px; padding: 14px 16px 26px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Settings.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8A979C"><svg viewBox="0 0 24 24" style="width: 26px; height: 26px"><path class="st" d="M6 6l12 12M18 6L6 18" style="stroke-width: 3"></path></svg></a>
    <h1 style="font-weight: 900; font-size: 24px; color: #1F2A2E">Edit profile</h1>
  </div>

  <div style="display: flex; align-items: center; gap: 16px">
    <div style="position: relative; width: 110px; height: 110px; flex: none">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #4C7BD9; color: #FFFFFF; font-weight: 900; font-size: 40px; display: flex; align-items: center; justify-content: center">TK</div>
      <div style="position: absolute; right: -4px; bottom: -2px; width: 60px; height: 60px; border-radius: 50%; background: #FFE9D9; border: 4px solid #F7F7F2; overflow: hidden; display: flex; align-items: center; justify-content: center"><img src="/_blob/d1b0d6198561f208461b0f6704094021" alt="Fox companion" style="width: 64px; height: 64px; margin-top: 12px"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button class="tag"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px"><path class="st" d="M3 8h4l2-3h6l2 3h4v11H3z"></path><circle class="st" cx="12" cy="13" r="3.5"></circle></svg>Change photo</button>
      <button class="tag"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; color: #E5820A"><rect class="fl" x="5" y="7" width="14" height="14" rx="4"></rect></svg>Backpack colour</button>
    </div>
  </div>

  <label class="f"><span class="lbl">Name</span><input class="in" value="Timur K."></label>
  <label class="f"><span class="lbl">Username</span><input class="in" value="@timur.k"></label>
  <label class="f"><span class="lbl">Bio</span><textarea class="in" rows="2">Weekend hiker from Tashkent. Lakes &gt; peaks. Always up for Mafia at camp.</textarea><span class="s" style="text-align: right">74 / 150</span></label>
  <label class="f"><span class="lbl">Home region</span><span class="in" style="display: flex; align-items: center; justify-content: space-between">Tashkent region<svg viewBox="0 0 24 24" style="width: 16px; height: 16px; color: #8A979C"><path class="st" d="M6 9l6 6 6-6"></path></svg></span></label>

  <div class="f">
    <span class="lbl">I love</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button class="tag on">Peaks</button><button class="tag on">Lakes</button><button class="tag">Caves</button><button class="tag on">Camping</button><button class="tag">Trails</button><button class="tag">Photography</button>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 2px solid #E5E5DC; border-bottom-width: 4px; border-radius: 20px; padding: 0 14px">
    <div class="row"><span style="flex-grow: 1; font-weight: 800; font-size: 15px; color: #1F2A2E">Show stats on my profile</span><span class="tg on" role="switch" aria-checked="true"></span></div>
    <div class="row" style="border-bottom: 0"><span style="flex-grow: 1; font-weight: 800; font-size: 15px; color: #1F2A2E">Show my home region</span><span class="tg off" role="switch" aria-checked="false"></span></div>
  </div>

  <div style="flex-grow: 1"></div>
  <a class="btn" href="Profile.dc.html" style="background: #0C807A; color: #FFFFFF; box-shadow: 0 4px 0 #075B56">Save</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
