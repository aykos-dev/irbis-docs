<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mafia — game over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.s{font-weight:700;font-size:13px;line-height:1.4;color:#9AA8AD}
.cap{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9AA8AD}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 16px;border:0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid #22323A}
.pa{width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.pa img{width:40px;height:40px;margin-top:8px}
.rl{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-weight:900;font-size:12px;color:#FFFFFF}
.cf{position:absolute;border-radius:3px}
.st{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fl{fill:currentColor}
</style>
</helmet>
<div style="width: 390px; height: 1140px; position: relative; overflow: hidden; background: #131D22; font-family: 'Nunito', system-ui, sans-serif; color: #D5DEDD; display: flex; flex-direction: column; gap: 14px; padding: 22px 16px 26px">
  <span class="cf" style="left: 30px; top: 40px; width: 12px; height: 12px; background: #1F74C7; transform: rotate(20deg)"></span>
  <span class="cf" style="left: 340px; top: 60px; width: 10px; height: 16px; background: #FFC800; transform: rotate(-30deg)"></span>
  <span class="cf" style="left: 70px; top: 160px; width: 14px; height: 8px; background: #2E8B57; transform: rotate(40deg)"></span>
  <span class="cf" style="left: 320px; top: 170px; width: 10px; height: 10px; background: #FF9F1C; border-radius: 50%"></span>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <div style="display: flex; align-items: flex-end">
      <img src="/_blob/beeba6646ed09cf1ddfe63e41e53efb4" alt="" style="width: 92px; height: 92px">
      <img src="/_blob/0c1003d26a9d5fd1e2189c0215a2ab74" alt="" style="width: 110px; height: 110px">
      <img src="/_blob/462ee3b41d848c53095996e3c6c9cd45" alt="" style="width: 92px; height: 92px">
    </div>
    <p style="font-weight: 900; font-size: 13px; letter-spacing: .12em; color: #8CC8FF">GAME OVER · NIGHT 3</p>
    <p style="font-weight: 900; font-size: 36px; line-height: 1; color: #F1F5F4">Town wins!</p>
    <p class="s">All mafia and the maniac are out · 7 players survived</p>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: #173452; border: 2px solid #1F74C7; border-bottom-width: 4px">
    <span style="width: 44px; height: 44px; border-radius: 14px; background: #FFC800; color: #3A2A00; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" style="width: 24px; height: 24px"><path class="fl" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"></path></svg></span>
    <div><p style="font-weight: 900; font-size: 15px; color: #F1F5F4">MVP · Laylo (Detective)</p><p class="s" style="color: #B8D4F0">Found the Mafia Boss on night 1</p></div>
  </div>

  <p class="cap">Everyone's role</p>
  <div style="border-radius: 20px; background: #1C2A30; border: 2px solid #2B3B42; padding: 2px 14px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div class="row" style="opacity: {{r.op}}">
        <span class="pa" style="background: {{r.tint}}"><img src="{{r.img}}" alt=""></span>
        <span style="flex-grow: 1; font-weight: 900; font-size: 14px; color: #F1F5F4">{{r.name}}</span>
        <span class="s" style="font-size: 12px">{{r.fate}}</span>
        <span class="rl" style="background: {{r.color}}">{{r.role}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px">
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: #1C2A30; border: 2px solid #2B3B42">
      <div style="filter: drop-shadow(0 3px 0 #1F6233); flex: none"><div style="width: 40px; height: 46px; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); background: #2E8B57; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg viewBox="0 0 24 24" style="width: 20px; height: 20px"><path class="fl" d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"></path></svg></div></div>
      <div><p style="font-weight: 900; font-size: 13px; color: #F1F5F4">Life Saver</p><p class="s" style="font-size: 11px">badge unlocked</p></div>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: #1C2A30; border: 2px solid #2B3B42">
      <svg viewBox="0 0 24 24" style="width: 30px; height: 30px; color: #FFC800; flex: none"><path class="fl" d="M13.5 1.5L4 14h7l-1.5 8.5L20 9.5h-7z"></path></svg>
      <div><p style="font-weight: 900; font-size: 13px; color: #F1F5F4">+12 XP</p><p class="s" style="font-size: 11px">syncs when online</p></div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; gap: 12px">
    <a class="btn" href="CampLobby.dc.html" style="flex: 1; background: #1C2A30; color: #F1F5F4; border: 2px solid #2B3B42; box-shadow: 0 4px 0 #2B3B42">Lobby</a>
    <a class="btn" href="MafRole.dc.html" style="flex: 1.4; background: #FF9F1C; color: #3A2200; box-shadow: 0 4px 0 #B86E00">Play again</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      fox: ['/_blob/d1b0d6198561f208461b0f6704094021', '#FFE9D9'], bear: ['/_blob/ffe227711df8d0445b9dfe0a9534a6f4', '#E3ECFB'],
      marmot: ['/_blob/d4c16d0e9ea4296c5638d9b3cf6bfee5', '#F7EADB'], eagle: ['/_blob/55d73e65f5c5f754c2cbb05b4ea4a0ce', '#ECE8FF'],
      panda: ['/_blob/44b792e405b2dce67f0743e4be0fc2e1', '#E4F5E7'], ibex: ['/_blob/dba7b9623f9af9c690bf93a6ddc5f60b', '#DDF5F3']
    };
    const R = { boss: ['Mafia Boss', '#8F1F1F'], mafia: ['Mafia', '#D93636'], det: ['Detective', '#1F74C7'], doc: ['Doctor', '#2E8B57'], man: ['Maniac', '#6A4FE8'], civ: ['Civilian', '#5E6E74'] };
    const list = [
      ['Bekzod', 'eagle', 'boss', 'exiled Day 2'], ['Otabek', 'panda', 'mafia', 'exiled Day 3'], ['Kamila', 'fox', 'mafia', 'killed Night 1'],
      ['Sherzod', 'fox', 'man', 'caught Night 3'], ['Laylo', 'marmot', 'det', 'alive'], ['Dilnoza (you)', 'ibex', 'doc', 'alive'],
      ['Timur', 'fox', 'civ', 'alive'], ['Aziz', 'bear', 'civ', 'alive'], ['Madina', 'marmot', 'civ', 'alive'], ['Nodira', 'ibex', 'civ', 'alive']
    ];
    return { rows: list.map(([name, a, role, fate]) => ({ name, fate, img: P[a][0], tint: P[a][1], role: R[role][0], color: R[role][1], op: fate === 'alive' ? 1 : 0.6 })) };
  }
}
</script>
</body>
</html>
